[package]
name = "laputa-loc"
version = "1.1.1"
authors = ["Quin Gillespie <trypsynth@gmail.com>"]
edition = "2024"
description = "The fastest and most accurate code counter around: code, comment, blank, and shebang lines by language, as text or JSON"
readme = "README.md"
repository = "https://github.com/joshuarli/loc"
license = "MIT"
keywords = ["code", "analysis", "cli", "statistics"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
rust-version = "1.88.0"
include = ["/src", "/build.rs", "/build", "/benches", "/languages.json5", "/README.md", "/LICENSE"]

[[bin]]
name = "loc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[bench]]
name = "bench"
harness = false

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
lexopt = "0.3.2"
crossbeam-deque = "0.8.8"
encoding_rs = "0.8.44"
ignore = "0.4.34"
memchr = "2.8.3"
memmap2 = "0.9.12"
num-format = { version = "0.4.4", default-features = false, features = ["std"] }
same-file = "1"
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
simdutf8 = "0.1.5"
terminal_size = "0.4.4"
toml = "1.1.8"

[build-dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
json5 = "1.3.7"
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
rstest = "0.28.0"
rustybench = "0.5"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
