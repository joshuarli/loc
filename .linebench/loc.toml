name         = "loc"
repository   = "https://github.com/joshuarli/loc"
version-flag = "--version"

[acquisition]
channel = "github-release-file"
name    = "trypsynth/codestats"
version = "1.1.1"

# Pin to the newest published release of the pre-rebrand code (v1.1.1), whose bare binaries linebench can fetch. joshuarli/loc's releases ship archives only, which linebench 0.4.1 does not read; bump this once the project publishes unarchived binaries alongside them.
[acquisition.file]
linux   = "cs-x86_64-unknown-linux-musl"
macos   = "cs-aarch64-apple-darwin"

[run]
args           = ["{target}"]
json           = ["--output", "json-compact"]
languages      = ["--ext", "{extensions}"]
same-work      = ["--no-gitignore", "--hidden", "--include-generated", "--no-gitattributes", "--no-config"]
same-work-note = "ignore files off, hidden files counted, generated files counted, linguist attributes off, no configuration file read"

[read]
files    = "totals.file_count"
lines    = "totals.lines.total"
code     = "totals.lines.code"
comments = "totals.lines.comment"
blanks   = "totals.lines.blank"
shebangs = "totals.lines.shebang"
